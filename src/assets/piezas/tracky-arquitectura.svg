<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d">
  <title id="t">Arquitectura de Tracky</title>
  <desc id="d">GitHub publica en Netlify, que sirve la aplicación y sus funciones. Las funciones leen y escriben en Supabase y llaman a la API de Claude. Un puente local de Whisper en la computadora del usuario transcribe el audio sin que salga de ahí.</desc>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3B2A1E"/>
    </marker>
    <style>
      .caja { fill: #FBF8F2; stroke: #3B2A1E; stroke-width: 3; }
      .clave { fill: #FBF8F2; stroke: #8E2B22; stroke-width: 3; }
      .local { fill: #EFE6D3; stroke: #B08D57; stroke-width: 3; stroke-dasharray: 10 8; }
      .t { font-family: Georgia, 'Times New Roman', serif; font-size: 40px; fill: #15120F; font-weight: 700; }
      .s { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 25px; fill: #3B2A1E; }
      .m { font-family: 'Courier New', monospace; font-size: 22px; fill: #8E2B22; letter-spacing: 2px; }
      .l { stroke: #3B2A1E; stroke-width: 3; fill: none; marker-end: url(#flecha); }
      .ld { stroke: #B08D57; stroke-width: 3; fill: none; stroke-dasharray: 10 8; marker-end: url(#flecha); }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#F2ECE1"/>
  <text x="80" y="92" class="m">AF-2026-002 · ARQUITECTURA</text>

  <rect x="80" y="170" width="360" height="200" rx="18" class="caja"/>
  <text x="120" y="250" class="t">GitHub</text>
  <text x="120" y="300" class="s">Código, specs y ADRs</text>

  <rect x="620" y="170" width="440" height="200" rx="18" class="caja"/>
  <text x="660" y="250" class="t">Netlify</text>
  <text x="660" y="300" class="s">PWA (Vite + Preact)</text>
  <text x="660" y="340" class="s">API (Hono) en funciones</text>

  <rect x="1180" y="120" width="360" height="200" rx="18" class="caja"/>
  <text x="1220" y="200" class="t">Supabase</text>
  <text x="1220" y="250" class="s">PostgreSQL + Auth</text>
  <text x="1220" y="290" class="s">Seguridad por renglón</text>

  <rect x="1180" y="420" width="360" height="200" rx="18" class="clave"/>
  <text x="1220" y="500" class="t">API de Claude</text>
  <text x="1220" y="550" class="s">Único secreto,</text>
  <text x="1220" y="590" class="s">solo en el servidor</text>

  <rect x="80" y="640" width="980" height="250" rx="18" class="local"/>
  <text x="120" y="710" class="m">TU COMPUTADORA</text>
  <text x="120" y="780" class="t">Puente local de Whisper · 127.0.0.1</text>
  <text x="120" y="835" class="s">Transcribe en la máquina del usuario: el audio nunca sale de ahí.</text>

  <path d="M440 270 L612 270" class="l"/>
  <text x="470" y="250" class="s">push</text>
  <path d="M1060 240 L1172 220" class="l"/>
  <path d="M1060 320 L1172 480" class="l"/>
  <path d="M760 640 L760 382" class="ld"/>
  <text x="780" y="520" class="s">solo texto</text>
</svg>
