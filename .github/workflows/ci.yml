name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  verifica:
    name: Esquema, tipos, compilación y ligas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos y esquema de contenido (spec 0002)
        run: npx astro check
      - name: Compilación
        run: npx astro build
      - name: Ligas internas
        run: node scripts/revisar-ligas.mjs dist /portafolio
      - name: Candados del asistente (spec 0015)
        working-directory: asistente
        run: npm ci && npm run tipos && npm run prueba
